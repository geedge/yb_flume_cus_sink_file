#A版:4, B版:2, C版:1
active.system=2

#插入类型  只kafka:1  只hdfs:2  kafka和hdfs:3
insert.type=2

#批量插入数据库条数
batch.insert.num=1000

#kafka消费group id
#group.id=df-ip-port-log-1812291718

#group.id共用前置字符串
group.id.prefix=1911111503

#group.id共用后置字符串
group.id.suffix=1911141842

#管理kafka地址
#数据源kafka地址
#bootstrap.servers=192.168.40.119:9092,192.168.40.122:9092,192.168.40.123:9092
bootstrap.servers=192.168.10.35:9092

#数据输出kafka地址
#bootstrap.output.servers=192.168.40.119:9092,192.168.40.122:9092,192.168.40.123:9092
bootstrap.output.servers=192.168.10.35:9092

#kafka broker下的topic名称
fail.ntc.collect.mail.log=FAIL-NTC-COLLECT-MAIL-LOG
fail.ntc.collect.http.doc.log=FAIL-NTC-COLLECT-HTTP-DOC-LOG
fail.ntc.collect.ftp.doc.log=FAIL-NTC-COLLECT-FTP-DOC-LOG


#从kafka哪里开始读：earliest/latest
auto.offset.reset=latest
#kafka一次fetch请求，从一个broker中取得的records最大大小(默认52428800)
fetch.max.bytes=524288000
#kafka每次单分区最大拉取字节数(默认1048576)
max.partition.fetch.bytes=104857600
#kafka最大拉取间隔,超过这个时间不拉取会退出消费者组(默认300000)
max.poll.interval.ms=300000
#kafka最大拉取量(默认500)
max.poll.records=50000
#kafka的Consumer session过期时间,这个值必须设置在broker configuration中的group.min.session.timeout.ms 与 group.max.session.timeout.ms之间(默认10000,代码里未变更,依旧写的10000L)
session.timeout.ms=60000


influx.table=filePostStatus
influx.action.msg=fileMsgCount
influx.action.file=fileCount
influx.action.file.bytes=fileBytesCount
influx.address=http://192.168.10.35:8086
influx.username=admin
influx.password=telegraf
influx.database=telegraf


#用于状态上传的X_Tag,对应getXTAG()方法
#yb-一部
monitor.nofile.msg.xtag={"task_id":["1"],"data_type":"4","data_source":"8","producer_id":"24832","tag_version":"1.0","data_subtype":"16387"}
#gd-广东
#monitor.nofile.msg.xtag={"tag_version":"1.0","data_subtype":"16387","data_type":"4","producer_id":"24832","task_id":["1025"]}

#放到YbHttpAvroSinkFile文件中的monitorMsgXTag配置,目前来看作用是验证获取状态的Cookie
monitor.msg.sink.file.xtag=tag_acc_567acb520844000

#监控器类型:一部(yb):状态上报+日志打印;广东(gd):日志打印,然后靠外部脚本收集到influxdb上传
#monitor.type=yb
monitor.type=gd

#用于状态的系统组件编码
#系统编码
monitor.system.component.code=24832
#组件编码-flume
monitor.system.component.code.flume=24833


#注册获取的数据对象SchemaID
#一部-YB
#schema.id.ntc-collect-file-log=0
#schema.id.ntc-conn-record-log=43
#schema.id.ntc-collect-http-doc-log=45
#schema.id.ntc-collect-mail-log=44
#schema.id.monitor-msg=22
#广东-GD
schema.id.ntc-collect-file-log=0
schema.id.ntc-conn-record-log=43
schema.id.ntc-collect-http-doc-log=45
schema.id.ntc-collect-http-av-log=45
schema.id.ntc-collect-mail-log=44
schema.id.ntc-collect-ftp-doc-log=6
schema.id.ntc-collect-telnet-log=6
schema.id.monitor-msg=22
schema.id.influx-sapp-bps-stat-log=22

#监控生产数是否每分钟重置：1-重置为0(每分钟值)；2-不重置(启动后累计值)
monitor.clean.type=1